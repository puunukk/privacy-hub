version: '3.9'

services:
  # Pi-hole - INTERNAL ONLY (no exposed ports)
  pihole:
    build: ./pihole
    container_name: pihole
    hostname: pihole
    environment:
      TZ: ${TZ:-Europe/Tallinn}
      WEBPASSWORD: ${PIHOLE_PASSWORD:-secure123}
      FTLCONF_LOCAL_IPV4: ${SERVER_IP}
      PIHOLE_DNS_: '1.1.1.1;1.0.0.1'
      VIRTUAL_HOST: ${HOSTNAME:-otsi}.${LOCAL_DOMAIN:-local}
    volumes:
      - './pihole/data:/etc/pihole'
      - './pihole/dnsmasq:/etc/dnsmasq.d'
    tmpfs:
      - /var/log
      - /tmp
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - internal

  # SearXNG - INTERNAL ONLY (no exposed ports)
  searxng:
    build: ./searxng
    container_name: searxng
    hostname: searxng
    environment:
      - SEARXNG_BASE_URL=https://${SERVER_IP}/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-auto-generated}
      - SEARXNG_DEFAULT_THEME=${SEARXNG_DEFAULT_THEME:-simple}
      - SEARXNG_SAFE_SEARCH=${SEARXNG_SAFE_SEARCH:-1}
      - SEARXNG_DEFAULT_LANG=${SEARXNG_DEFAULT_LANG:-en}
    volumes:
      - './searxng/data:/etc/searxng'
    tmpfs:
      - /var/log
      - /tmp
      - /var/cache
    restart: unless-stopped
    networks:
      - internal

  # Docker API Proxy - secure Docker socket access
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    hostname: docker-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      POST: 1
      STATS: 1 # Enable container statistics (CPU/memory usage)
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - internal

  # Frontend builder - builds React app and copies to nginx
  # frontend-builder:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.build
  #   container_name: frontend-builder
  #   volumes:
  #     - './data/nginx/html:/output/dist' # Copy built files to nginx directory
  #   # This container builds the frontend once, then exits
  #   restart: "no"

  # Backend service installer - builds and installs backend as system service
  backend-installer:
    build:
      context: ./backend
      dockerfile: Dockerfile.auto
    container_name: backend-installer
    privileged: true
    volumes:
      - /opt:/host/opt
      - /etc/systemd/system:/host/etc/systemd/system
      - /usr/bin:/host/usr/bin
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    # This container runs once to install the service, then exits
    restart: "no"

  # NGINX - ONLY PUBLIC-FACING SERVICE (serves static dashboard)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.pi
    container_name: nginx
    hostname: nginx
    ports:
      - "53:53/tcp" # DNS
      - "53:53/udp" # DNS
      - "80:80" # HTTP
      - "443:443" # HTTPS
    extra_hosts:
      - "host.docker.internal:host-gateway" # Maps to Docker host IP
    volumes:
      # - './nginx/nginx.pi.conf:/etc/nginx/nginx.conf' # Use Pi-specific config
      - './nginx/ssl:/etc/nginx/ssl'
      # Optional: override baked-in static dashboard with files from host
      # Enable by uncommenting and placing built files into ./data/nginx/html
      # - './data/nginx/html:/usr/share/nginx/html:ro' # Serve built frontend files
    tmpfs:
      - /var/log/nginx
      - /tmp
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
