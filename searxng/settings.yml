use_default_settings: true

server:
  secret_key: "CHANGE_ME_TO_RANDOM_50_CHARS"
  bind_address: "0.0.0.0"
  port: 8080
  # No base_url - let NGINX handle it
  base_url: false
  public_instance: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"

ui:
  default_theme: simple
  simple_style: dark
  query_in_title: true
  infinite_scroll: false
  center_alignment: true
  
# ZERO LOGGING for SD card protection
logging:
  level: CRITICAL

outgoing:
  request_timeout: 3.0
  max_request_timeout: 15.0
  
engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: bing
    disabled: false 