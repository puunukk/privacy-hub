# Privacy Hub Pi Host Production - Host NGINX Setup
# NGINX runs on the host system, all other services in Docker
# Optimized for Raspberry Pi with production settings

# Named volumes for persistent data
volumes:
  pihole_data:
  pihole_dnsmasq:
  searxng_data:
  redis_data:
  go_backend_data:

# Networks - external allows host NGINX to reach containers
networks:
  ph_external:
    driver: bridge
  ph_internal:
    driver: bridge
    internal: true

services:
  # Redis Cache - Production optimized
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-PH_Redis}
    restart: unless-stopped
    networks:
      - ph_internal
    volumes:
      - redis_data:/data
      # Centralized logging - persist logs to host
      - ./logs/redis:/var/log/redis
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    logging:
      driver: "local"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Pi-hole DNS Server - NO EXPOSED PORTS (accessed via host NGINX)
  pihole:
    image: pihole/pihole:latest
    container_name: ${PIHOLE_CONTAINER_NAME:-PH_Pihole}
    hostname: ${PIHOLE_HOSTNAME:-pihole}
    environment:
      TZ: ${TZ:-UTC}
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      FTLCONF_LOCAL_IPV4: ${SERVER_IP}
      PIHOLE_DNS_: ${PIHOLE_DNS:-1.1.1.1;1.0.0.1}
      VIRTUAL_HOST: ${DOMAIN_NAME:-privacy-hub.local}
      DNSMASQ_USER: root
    volumes:
      - pihole_data:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      # Centralized logging - persist logs to host
      - ./logs/pihole:/var/log
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:false
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    restart: unless-stopped
    networks:
      - ph_external
      - ph_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/admin/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SearXNG Search Engine - NO EXPOSED PORTS (accessed via host NGINX)
  searxng:
    image: searxng/searxng:latest
    container_name: ${SEARXNG_CONTAINER_NAME:-PH_SearXNG}
    restart: unless-stopped
    networks:
      - ph_external
      - ph_internal
    environment:
      - BASE_URL=https://${DOMAIN_NAME:-privacy-hub.local}/search/
      - INSTANCE_NAME=${SEARXNG_INSTANCE_NAME:-Privacy Hub Search}
      - AUTOCOMPLETE=${SEARXNG_AUTOCOMPLETE:-google}
      - SEARXNG_SECRET=${SEARXNG_SECRET:-ultrasecretkey}
      - UWSGI_WORKERS=${SEARXNG_WORKERS:-2}
      - UWSGI_THREADS=${SEARXNG_THREADS:-2}
    volumes:
      - searxng_data:/etc/searxng:rw
      - './searxng/data:/etc/searxng'
      # Centralized logging - persist logs to host
      - ./logs/searxng:/var/log
    tmpfs:
      - /tmp
      - /var/cache
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Go Backend API - NO EXPOSED PORTS (accessed via host NGINX)
  go_backend:
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile.build}
      args:
        TARGETOS: linux
        TARGETARCH: ${TARGET_ARCH:-arm64}
        VERSION: ${VERSION:-1.0.0}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: ${BACKEND_CONTAINER_NAME:-PH_API_Backend}
    restart: unless-stopped
    environment:
      - GO_ENV=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${BACKEND_PORT:-8111}
    volumes:
      # Host system access for monitoring (read-only)
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Data
      - go_backend_data:/app/data
      # Centralized logging - persist logs to host
      - ./logs/go-backend:/app/logs
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - docker-proxy
    networks:
      - ph_external
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8111/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Docker API Proxy - Production security
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: ${DOCKER_PROXY_CONTAINER_NAME:-PH_Docker_Proxy}
    restart: unless-stopped
    networks:
      - ph_internal
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      PING: 1
      LOG_LEVEL: ${DOCKER_PROXY_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend Builder - Build-time only (use with --profile build)
  frontend_builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
      args:
        NODE_ENV: production
        VITE_API_BASE_URL: /api
        VITE_DOCKER_API_BASE_URL: /docker
    container_name: ${FRONTEND_BUILDER_CONTAINER_NAME:-PH_Frontend_Builder}
    volumes:
      # Output built files to host directory for NGINX
      - ./data/nginx/html:/output:rw
    # Copy files and exit - this is a build-time container
    command: sh -c "cp -r /static-files/* /output/ && echo 'Frontend build copied to /output' && ls -la /output"
    restart: "no" # Only run once
    profiles:
      - build # Only run when explicitly requested

  # NGINX Config Generator - Generates host NGINX configuration
  # Runs once to generate config, then exits (use with --profile build)
  nginx_config_generator:
    build:
      context: ./nginx
      dockerfile: dockerfiles/Dockerfile.config
    container_name: ${NGINX_CONFIG_CONTAINER_NAME:-PH_Config_Generator}
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-privacy-hub.local}
      - SERVER_IP=${SERVER_IP}
      - FRONTEND_ROOT=${FRONTEND_ROOT:-/var/www/privacy-hub}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/nginx/ssl/server.crt}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/nginx/ssl/server.key}
      # Container names for upstream configuration
      - PIHOLE_CONTAINER_NAME=${PIHOLE_CONTAINER_NAME:-PH_Pihole}
      - SEARXNG_CONTAINER_NAME=${SEARXNG_CONTAINER_NAME:-PH_SearXNG}
      - BACKEND_CONTAINER_NAME=${BACKEND_CONTAINER_NAME:-PH_API_Backend}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - DOCKER_PROXY_CONTAINER_NAME=${DOCKER_PROXY_CONTAINER_NAME:-PH_Docker_Proxy}
    volumes:
      # Output generated config to host directory
      - ./data/nginx/config:/config:rw
    restart: "no" # Only run once
    profiles:
      - build # Only run when explicitly requested

# Privacy Hub Pi Host Production - Host NGINX Setup
# Usage:
#   1. Build frontend: docker-compose -f docker-compose.pi-host-prod.yml --profile build up frontend_builder
#   2. Generate NGINX config: docker-compose -f docker-compose.pi-host-prod.yml --profile build up nginx_config_generator
#   3. Copy config to host: sudo cp data/nginx/config/nginx.conf /etc/nginx/sites-available/privacy-hub
#   4. Enable site: sudo ln -s /etc/nginx/sites-available/privacy-hub /etc/nginx/sites-enabled/
#   5. Start services: docker-compose -f docker-compose.pi-host-prod.yml up -d
#   6. Reload host NGINX: sudo nginx -s reload
#   7. Access: https://[SERVER_IP] or https://privacy-hub.local