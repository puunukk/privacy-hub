services:
  # Pi-hole - INTERNAL ONLY (no exposed ports)
  pihole:
    build: ./pihole
    container_name: pihole
    hostname: pihole
    # NO PORTS EXPOSED TO HOST - only internal
    environment:
      TZ: ${TZ:-Europe/Tallinn}
      WEBPASSWORD: ${PIHOLE_PASSWORD:-secure123}
      FTLCONF_LOCAL_IPV4: ${SERVER_IP}
      PIHOLE_DNS_: '1.1.1.1;1.0.0.1'
      VIRTUAL_HOST: ${HOSTNAME:-otsi}.${LOCAL_DOMAIN:-local}
    volumes:
      - './pihole/data:/etc/pihole'
      - './pihole/dnsmasq:/etc/dnsmasq.d'
    tmpfs:
      - /var/log
      - /tmp
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/api.php?version"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    networks:
      - internal

  # SearXNG - INTERNAL ONLY (no exposed ports)  
  searxng:
    build: ./searxng
    container_name: searxng
    hostname: searxng
    # NO PORTS EXPOSED TO HOST - only internal
    environment:
      - SEARXNG_BASE_URL=https://${SERVER_IP}/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-auto-generated}
      - SEARXNG_DEFAULT_THEME=${SEARXNG_DEFAULT_THEME:-simple}
      - SEARXNG_SAFE_SEARCH=${SEARXNG_SAFE_SEARCH:-1}
      - SEARXNG_DEFAULT_LANG=${SEARXNG_DEFAULT_LANG:-en}
    volumes:
      - './searxng/data:/etc/searxng'
    tmpfs:
      - /var/log
      - /tmp
      - /var/cache
    restart: unless-stopped
    networks:
      - internal

  # Docker API Proxy - secure Docker socket access
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    hostname: docker-proxy
    # NO PORTS EXPOSED - internal only
    environment:
      # Minimal permissions for security
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      STATS: 1 # Enable container statistics (CPU/memory usage)
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      POST: 1 # Allow start/stop/restart only
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - internal

  # NO FRONTEND CONTAINER - static files served by nginx

  # NGINX - ONLY PUBLIC-FACING SERVICE
  nginx:
    build: ./nginx
    container_name: nginx
    hostname: nginx
    ports:
      # ONLY these ports exposed to network
      - "53:53/tcp" # DNS
      - "53:53/udp" # DNS  
      - "80:80" # HTTP
      - "443:443" # HTTPS
    volumes:
      - './nginx/ssl:/etc/nginx/ssl'
    tmpfs:
      - /var/log/nginx
      - /tmp
    restart: unless-stopped
    depends_on:
      - pihole
      - searxng
      - docker-proxy
    networks:
      - internal

networks:
  internal:
    driver: bridge
    # No need to specify IP ranges - Docker handles it 
