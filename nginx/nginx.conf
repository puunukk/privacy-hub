# Global configuration
worker_processes auto;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

# Stream block for DNS forwarding
stream {
    # Forward DNS queries to Pi-hole
    upstream pihole_dns {
        server pihole:53;
    }
    
    server {
        listen 53 udp;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    server {
        listen 53;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
    }
}

# HTTP block for web services
http {
    include /etc/nginx/mime.types;
    
    # Disable access logs (save SD card)
    access_log off;
    error_log /dev/stderr crit;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    
    # Upstream services (using Docker service names!)
    upstream searxng_backend {
        server searxng:8080;
    }
    
    upstream pihole_backend {
        server pihole:80;
    }
    
    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name _;
        
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }
    
    # HTTPS server (main interface)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        
        # Pi-hole - everything under /pihole/* goes to Pi-hole (admin, API, everything)
        location /pihole/ {
            proxy_pass http://pihole_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        # Root location - SearXNG (your homepage idea!)
        location / {
            proxy_pass http://searxng_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub OK\n";
            add_header Content-Type text/plain;
        }
    }
} 