# Global configuration
worker_processes auto;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

# Stream block for DNS forwarding
stream {
    # Forward DNS queries to Pi-hole
    upstream pihole_dns {
        server pihole:53;
    }
    
    server {
        listen 53 udp;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    server {
        listen 53;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
    }
}

# HTTP block for web services
http {
    include /etc/nginx/mime.types;
    
    # Disable access logs (save SD card)
    access_log off;
    error_log /dev/stderr crit;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    
    # Upstream services (using Docker service names!)
    upstream searxng_backend {
        server searxng:8080;
    }
    
    upstream pihole_backend {
        server pihole:80;
    }
    
    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name _;
        
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }
    
    # HTTPS server (main interface)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        
        # Pi-hole admin interface - handle root admin access
        location = /admin {
            return 301 https://$host/admin/;
        }
        
        # Pi-hole admin interface (most specific first)
        location /admin/ {
            proxy_pass http://pihole_backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Critical: Handle ALL Pi-hole redirects properly
            proxy_redirect http://pihole/admin/ https://$host/admin/;
            proxy_redirect http://pihole:80/admin/ https://$host/admin/;
            proxy_redirect http://pihole_backend/admin/ https://$host/admin/;
            proxy_redirect /admin/ /admin/;
            proxy_redirect / /admin/;
            
            # Fix session/cookie handling for authentication
            proxy_cookie_path /admin /admin;
            proxy_cookie_domain ~^(.*)$ $host;
            
            # Handle index redirects specifically
            proxy_intercept_errors off;
        }
        
        # Pi-hole API endpoints - both /admin/api and /api paths used by Pi-hole admin
        location /admin/api {
            proxy_pass http://pihole_backend/admin/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Session handling for API
            proxy_cookie_path / /;
            proxy_cookie_domain ~^(.*)$ $host;
        }
        
        # Pi-hole API endpoints (login, info, etc.) - used by admin interface
        location /api/info {
            proxy_pass http://pihole_backend/api/info;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Session handling
            proxy_cookie_path / /;
            proxy_cookie_domain ~^(.*)$ $host;
        }
        
        location /api/auth {
            proxy_pass http://pihole_backend/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Critical: Proper session/cookie handling for authentication
            proxy_cookie_path / /;
            proxy_cookie_domain ~^(.*)$ $host;
            
            # Ensure all headers are passed for authentication
            proxy_pass_request_headers on;
        }
        
        # SearXNG API endpoints (remaining /api/* routes)
        location /api {
            proxy_pass http://searxng_backend/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        # Root location - SearXNG (your homepage idea!)
        location / {
            proxy_pass http://searxng_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub OK\n";
            add_header Content-Type text/plain;
        }
    }
} 