# Production nginx config - serves static React files
worker_processes auto;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

# Stream block for DNS forwarding
stream {
    upstream pihole_dns {
        server pihole:53;
    }
    
    server {
        listen 53 udp;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    server {
        listen 53;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
    }
}

http {
    include /etc/nginx/mime.types;
    
    # Disable access logs (save SD card)
    access_log off;
    error_log /dev/stderr crit;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    
    # Upstream services
    upstream searxng_backend {
        server searxng:8080 max_fails=3 fail_timeout=30s;
    }
    
    upstream pihole_backend {
        server pihole:80 max_fails=3 fail_timeout=30s;
    }
    
    upstream docker_proxy {
        server docker-proxy:2375;
    }
    
    # HTTP server (serve HTTP for LAN convenience; HTTPS still available)
    server {
        listen 80;
        server_name _;

        location /health {
            return 200 "Privacy Hub OK\n";
            add_header Content-Type text/plain;
        }

        # Serve SPA statically for multiple entry paths (dashboard, home, manage)
        location ~* ^/(dashboard|home|manage)(/.*)?$ {
            try_files $uri $uri/ @spa_http;
        }

        # Cache static assets under those paths
        location ~* ^/(dashboard|home|manage)/.+\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Pi-hole admin over HTTP (local only)
        location /admin {
            proxy_pass http://pihole_backend/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Root over HTTP routes to SearXNG
        location / {
            proxy_pass http://searxng_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Named location to serve SPA index over HTTP
        location @spa_http {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
    }
    
    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        
        # PRODUCTION: SPA static files for multiple entry paths
        location ~* ^/(dashboard|home|manage)(/.*)?$ {
            try_files $uri $uri/ @spa_https;
        }

        # Cache static assets under those paths
        location ~* ^/(dashboard|home|manage)/.+\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Named location to serve SPA index over HTTPS
        location @spa_https {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
        
        # Docker API
        location /api/docker/ {
            rewrite ^/api/docker/(.*) /$1 break;
            proxy_pass http://docker_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        # Pi-hole API
        location /api {
            proxy_pass http://pihole_backend/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Pi-hole admin
        location /admin {
            proxy_pass http://pihole_backend/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            proxy_redirect http://$host/admin/ https://$host/admin/;
            proxy_cookie_path /admin /admin;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub OK\n";
            add_header Content-Type text/plain;
        }
        
        # Root - SearXNG
        location / {
            proxy_pass http://searxng_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}