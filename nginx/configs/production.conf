# NGINX Production Configuration
# Purpose: Production environment serving static frontend files
# Used by: docker-compose.pi-prod.yml  
# Features: Static file serving, full SSL, security headers, performance optimizations

worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

# DNS forwarding
stream {
    upstream pihole_dns {
        server pihole:53 max_fails=3 fail_timeout=30s;
    }
    
    server {
        listen 53 udp;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    server {
        listen 53;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Production logging (minimal)
    access_log off;
    error_log /dev/stderr warn;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # Production upstream services
    upstream backend_api {
        server go_backend:8111 max_fails=3 fail_timeout=30s;
    }
    
    upstream docker_api {
        server docker-proxy:2375 max_fails=3 fail_timeout=30s;
    }
    
    upstream pihole_api {
        server pihole:80 max_fails=3 fail_timeout=30s;
    }
    
    upstream searxng_service {
        server searxng:8080 max_fails=3 fail_timeout=30s;
    }
    
    # HTTP Server (redirect to HTTPS)
    server {
        listen 80;
        server_name _;
        
        # Health check allowed on HTTP
        location /health {
            return 200 "Privacy Hub Production OK\\n";
            add_header Content-Type text/plain;
        }
        
        # Pi-hole admin allowed on HTTP for local access
        location /admin {
            proxy_pass http://pihole_api/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Pi-hole API allowed on HTTP
        location /api {
            proxy_pass http://pihole_api/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS Server (main production interface)
    server {
        listen 443 ssl http2;
        server_name _;
        
        # SSL Configuration (production-grade)
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Security headers (production-grade)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Static file serving with caching
        location ~ ^/dashboard/?(.*)$ {
            alias /var/www/privacy-hub/;
            try_files $1 $1/ /index.html;
            
            # Cache static assets
            location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options nosniff;
            }
            
            # Security for HTML files
            location ~* \\.html$ {
                expires 0;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
        
        # Backend API
        location /api/pi-system/ {
            rewrite ^/api/pi-system/(.*) /$1 break;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Production timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # Docker API
        location /api/docker/ {
            rewrite ^/api/docker/(.*) /$1 break;
            proxy_pass http://docker_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Pi-hole API
        location /api {
            proxy_pass http://pihole_api/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Pi-hole Admin
        location /admin {
            proxy_pass http://pihole_api/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_redirect http://$host/admin/ https://$host/admin/;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub Production HTTPS OK\\n";
            add_header Content-Type text/plain;
        }
        
        # SearXNG (root)
        location / {
            proxy_pass http://searxng_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}