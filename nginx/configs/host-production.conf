# NGINX Host Production Configuration
# Purpose: System NGINX configuration for host-based deployment
# Used by: host system NGINX (copied to /etc/nginx/nginx.conf)
# Features: Container proxying, production security, performance

# This file is generated by Dockerfile.config and copied to host system

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 16m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=5r/s;
    
    # Upstream services (Docker containers)
    upstream backend_api {
        server 127.0.0.1:8111 max_fails=3 fail_timeout=30s;
    }
    
    upstream docker_api {
        server 127.0.0.1:2375 max_fails=3 fail_timeout=30s;
    }
    
    upstream pihole_service {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    }
    
    upstream searxng_service {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    }
    
    # HTTP Server (redirect to HTTPS)
    server {
        listen 80;
        server_name DOMAIN_NAME;
        
        # Pi-hole admin (local access allowed)
        location /admin {
            proxy_pass http://pihole_service/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Pi-hole API (local access allowed)
        location /api {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://pihole_service/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub Host OK\\n";
            add_header Content-Type text/plain;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS Server (main interface)
    server {
        listen 443 ssl http2;
        server_name DOMAIN_NAME;
        
        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/DOMAIN_NAME/chain.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        # Dashboard (static files)
        location ~ ^/dashboard/?(.*)$ {
            limit_req zone=dashboard burst=10 nodelay;
            
            root FRONTEND_ROOT;
            try_files $1 $1/ /index.html;
            
            # Cache static assets
            location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary "Accept-Encoding";
            }
            
            # No cache for HTML
            location ~* \\.html$ {
                expires 0;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
        }
        
        # Backend API
        location /api/pi-system/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/pi-system/(.*) /$1 break;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Docker API
        location /api/docker/ {
            limit_req zone=api burst=10 nodelay;
            rewrite ^/api/docker/(.*) /$1 break;
            proxy_pass http://docker_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Pi-hole API
        location /api {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://pihole_service/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Pi-hole Admin
        location /admin {
            proxy_pass http://pihole_service/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_Set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub Host HTTPS OK\\n";
            add_header Content-Type text/plain;
        }
        
        # SearXNG (root)
        location / {
            proxy_pass http://searxng_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}