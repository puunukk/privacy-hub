# NGINX Simple Production Configuration
# Simplified version to get basic functionality working

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    
    # Main server - HTTP only for now
    server {
        listen 80 default_server;
        server_name _;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        # Frontend Dashboard SPA
        location /dashboard/ {
            alias /var/www/privacy-hub/;
            index index.html;
            try_files $uri $uri/ /dashboard/index.html;
        }
        
        # Frontend static assets
        location /dashboard/assets/ {
            alias /var/www/privacy-hub/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Pi-hole Admin (using variable for dynamic resolution)
        location /admin {
            set $pihole_backend "http://pihole:80";
            proxy_pass $pihole_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Custom Go Backend API
        location /api/pi-system/ {
            set $backend_api "http://go_backend:8111";
            proxy_pass $backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Docker API Proxy
        location /api/docker/ {
            set $docker_api "http://docker-proxy:2375";
            rewrite ^/api/docker/(.*) /$1 break;
            proxy_pass $docker_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Pi-hole API
        location /api {
            set $pihole_api "http://pihole:80";
            proxy_pass $pihole_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # SearXNG (root) with fallback
        location / {
            set $searxng_backend "http://searxng:8080";
            
            proxy_pass $searxng_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Handle errors when SearXNG is not available
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            
            # Error handling
            error_page 502 503 504 = @fallback;
        }
        
        # Fallback page when SearXNG is not available
        location @fallback {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Privacy Hub</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        h1 { color: #333; }
        .links { margin-top: 30px; }
        .links a { display: inline-block; margin: 10px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
        .links a:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Welcome to Privacy Hub</h1>
    <p>Search service is starting up. Please try again in a moment.</p>
    <div class="links">
        <a href="/dashboard/">Dashboard</a>
        <a href="/admin">Pi-hole Admin</a>
        <a href="/api/pi-system/health">API Health</a>
    </div>
</body>
</html>';
        }
    }
}