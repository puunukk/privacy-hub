# NGINX Development Configuration
# Purpose: Development environment with frontend dev server proxy
# Used by: docker-compose.pi-dev.yml
# Features: HMR support, debug logging, graceful service fallbacks

worker_processes auto;
error_log /dev/stdout info;  # More verbose logging for development

events {
    worker_connections 1024;
}

# DNS forwarding with fallback
stream {
    upstream pihole_dns {
        server pihole:53 max_fails=3 fail_timeout=10s;
        server 1.1.1.1:53 backup;  # Fallback DNS
    }
    
    server {
        listen 53 udp;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    server {
        listen 53;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
    }
}

http {
    include /etc/nginx/mime.types;
    
    # Development logging
    access_log /dev/stdout;
    error_log /dev/stdout info;
    
    # Basic optimizations
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    
    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s;
    
    # Resilient upstream services - removed static upstream block
    # frontend will be resolved dynamically in proxy_pass
    
    upstream backend_api {
        server go_backend:8111 max_fails=3 fail_timeout=10s;
    }
    
    upstream docker_api {
        server docker-proxy:2375 max_fails=3 fail_timeout=10s;
    }
    
    upstream pihole_api {
        server pihole:80 max_fails=3 fail_timeout=10s;
    }
    
    upstream searxng_service {
        server searxng:8080 max_fails=3 fail_timeout=10s;
    }
    
    # Error pages configuration (will be used in server blocks)
    # Note: location blocks moved to individual server contexts
    
    # HTTP Server - Development friendly
    server {
        listen 80;
        server_name _;
        
        # Error pages
        error_page 404 /404.html;
        error_page 502 503 504 /5xx.html;
        
        # Serve error pages from nginx html directory
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /5xx.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub Development OK\\n";
            add_header Content-Type text/plain;
        }
        
        # Frontend - simple proxy everything under /dashboard to frontend
        location /dashboard {
            proxy_pass http://PH_Frontend_Dev:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Backend API (most specific first)
        location /api/pi-system/ {
            rewrite ^/api/pi-system/(.*) /$1 break;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_intercept_errors on;
        }
        
        # Docker API (specific)
        location /api/docker/ {
            rewrite ^/api/docker/(.*) /$1 break;
            proxy_pass http://docker_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_intercept_errors on;
        }
        
        # Pi-hole API (general - MUST be after specific /api/ routes)
        location /api {
            proxy_pass http://pihole_api/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
            proxy_intercept_errors on;
        }
        
        # Pi-hole Admin
        location /admin {
            proxy_pass http://pihole_api/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_intercept_errors on;
        }
        
        # SearXNG (root) - MUST BE LAST as it catches everything
        location / {
            proxy_pass http://searxng_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_intercept_errors on;
        }
    }
    
    # HTTPS Server - Development with SSL
    server {
        listen 443 ssl http2;
        server_name _;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Error pages
        error_page 404 /404.html;
        error_page 502 503 504 /5xx.html;
        
        # Serve error pages from nginx html directory
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /5xx.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Security headers (relaxed for development)
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        
        # Same locations as HTTP but with HTTPS context
        location /health {
            return 200 "Privacy Hub Development HTTPS OK\\n";
            add_header Content-Type text/plain;
        }
        
        # Frontend - simple proxy everything under /dashboard to frontend
        location /dashboard {
            proxy_pass http://PH_Frontend_Dev:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Backend API - HTTPS
        location /api/pi-system/ {
            rewrite ^/api/pi-system/(.*) /$1 break;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_intercept_errors on;
        }
        
        # Docker API - HTTPS
        location /api/docker/ {
            rewrite ^/api/docker/(.*) /$1 break;
            proxy_pass http://docker_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_intercept_errors on;
        }
        
        # Pi-hole API - HTTPS
        location /api {
            proxy_pass http://pihole_api/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
            proxy_intercept_errors on;
        }
        
        # Pi-hole Admin - HTTPS
        location /admin {
            proxy_pass http://pihole_api/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_intercept_errors on;
        }
        
        # SearXNG (root) - HTTPS
        location / {
            proxy_pass http://searxng_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_intercept_errors on;
        }
    }
    
    # WebSocket upgrade handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}