# Main Site Configuration - SIMPLE AND CLEAN
# Path-based routing for all services

# HTTP Server - Redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name otsi otsi.local 192.168.1.120 _;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Server - Main Configuration
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name otsi otsi.local 192.168.1.120 _;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    root /usr/share/nginx/html;
    
    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
    
    # Frontend Dashboard
    location /dashboard/ {
        alias /var/www/privacy-hub/;
        try_files $uri $uri/ /dashboard/index.html;
    }
    
    # Go Backend API
    location /pi-system/ {
        proxy_pass http://go_backend:8111/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Docker API
    location /docker-api/ {
        rewrite ^/docker-api/(.*) /$1 break;
        proxy_pass http://docker-proxy:2375;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Pi-hole Admin
    location /admin {
        proxy_pass http://pihole:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Pi-hole API
    location /api {
        proxy_pass http://pihole:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # SearXNG at root
    location / {
        proxy_pass http://searxng:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Use proper error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /5xx.html;
}

