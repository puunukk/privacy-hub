# Pi-hole Subdomain Configuration
# Handles pihole.domain.com -> Pi-hole Admin Interface
# This provides clean subdomain access: pihole.privacy-hub.local

server {
    listen 80;
    listen [::]:80;
    # Match pihole.* for any hostname/domain
    server_name ~^pihole\.(.+)$;
    
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS version
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Match pihole.* for any hostname/domain
    server_name ~^pihole\.(.+)$;
    
    # SSL configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Root redirect to admin interface
    location / {
        proxy_pass http://pihole:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle Pi-hole redirects for subdomain
        proxy_redirect http://pihole/ /;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"pihole-subdomain"}';
        add_header Content-Type application/json;
    }
    
    # Use proper error pages
    error_page 502 503 504 /5xx.html;
    root /usr/share/nginx/html;
}