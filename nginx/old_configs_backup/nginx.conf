# Global configuration
worker_processes auto;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

# Stream block for DNS forwarding
stream {
    # Forward DNS queries to Pi-hole
    upstream pihole_dns {
        server pihole:53;
    }
    
    server {
        listen 53 udp;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    server {
        listen 53;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
    }
}

# HTTP block for web services
http {
    include /etc/nginx/mime.types;
    
    # Disable access logs (save SD card)
    access_log off;
    error_log /dev/stderr crit;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    
    # Upstream services (using Docker service names!)
    upstream searxng_backend {
        server searxng:8080 max_fails=3 fail_timeout=30s;
    }
    
    upstream pihole_backend {
        server pihole:80 max_fails=3 fail_timeout=30s;
    }
    
    # New upstreams for dashboard
    upstream docker_proxy {
        server docker-proxy:2375;
    }
    
    # For development: proxy to frontend container
    upstream frontend_dev {
        server frontend:3000;
    }
    
    upstream backend {
        server go_backend:8111;
    }
    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name _;
        
        # Allow health checks on HTTP
        location /health {
            return 200 "Privacy Hub OK\n";
            add_header Content-Type text/plain;
        }

        # System Power API - MORE specific than /api (must come before Pi-hole API)
        location /api/pi-system/ {
            rewrite ^/api/pi-system/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Allow POST requests
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }

        # Pi-hole admin interface (HTTP allowed for local access)
        location /admin {
            proxy_pass http://pihole_backend/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Handle Pi-hole's internal redirects correctly
            proxy_redirect http://$host/admin/ https://$host/admin/;
            
            # Allow cookies and sessions to work properly
            proxy_cookie_path /admin /admin;
        }

        # Dashboard on HTTP - redirect to HTTPS  
        location ~ ^/dashboard/?(.*)$ {
            return 301 https://$host$request_uri;
        }

        # Pi-hole API (HTTP allowed for local access) - CRITICAL for authentication
        # Pi-hole told us: "The API is hosted at pi.hole/api, not pi.hole/admin/api"
        location /api {
            proxy_pass http://pihole_backend/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Allow POST requests and authentication
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS server (main interface)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        
        # Dashboard - DEV proxy to Vite dev server
        location ~ ^/dashboard/?(.*)$ {
            proxy_pass http://frontend_dev/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket support for HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Handle errors gracefully
            proxy_intercept_errors on;
            error_page 502 503 504 @frontend_unavailable;
        }
        
        # Fallback when frontend is starting
        location @frontend_unavailable {
            add_header Content-Type text/html;
            return 503 '<!DOCTYPE html><html><head><title>Frontend Starting</title><meta http-equiv="refresh" content="3"></head><body><h1>🚀 Frontend Dev Server Starting...</h1><p>Please wait, auto-refreshing...</p></body></html>';
        }

        # Docker API - MORE specific than /api (must come first)
        # Temperature sensor endpoint - serve from mounted file
        # Add before generic /api locations
        location /api/temp/ {
            alias /var/temp/cpu_temp;
            #add_header Content-Type text/plain;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
        }

        # Docker API - MORE specific than /api (must come first)
        location /api/docker/ {
            rewrite ^/api/docker/(.*) /$1 break;
            proxy_pass http://docker_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # System Power API - MORE specific than /api (must come before Pi-hole API)
        location /api/pi-system/ {
            rewrite ^/api/pi-system/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Allow POST requests
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Pi-hole API - LESS specific than /api/docker (must come after)
        location /api {
            proxy_pass http://pihole_backend/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Allow POST requests and authentication
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
        }
        
        # Pi-hole admin interface
        location /admin {
            proxy_pass http://pihole_backend/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # Handle Pi-hole's internal redirects correctly
            proxy_redirect http://$host/admin/ https://$host/admin/;
            
            # Allow cookies and sessions to work properly
            proxy_cookie_path /admin /admin;
        }
        
        # Health check
        location /health {
            return 200 "Privacy Hub OK\n";
            add_header Content-Type text/plain;
        }

        # Root location - SearXNG (your homepage idea!)
        location / {
            proxy_pass http://searxng_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

    }
} 