user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 512;
    use epoll;
}

# HTTP/HTTPS proxying
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance settings for Pi
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;

    # Upstreams to internal Docker containers
    upstream pihole_web {
        server privacy_hub_pihole:80;  # Host can reach this!
    }

    upstream searxng_web {
        server privacy_hub_searxng:8080;  # Host can reach this!
    }

    upstream go_backend_api {
        server privacy_hub_go_backend:8080;  # Host can reach this!
    }

    upstream docker_proxy_api {
        server privacy_hub_docker_proxy:2375;  # Host can reach this!
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # ROOT = SearXNG (homepage)
        location / {
            limit_req zone=search burst=30 nodelay;
            proxy_pass http://searxng_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Pi-hole admin
        location /admin {
            limit_req zone=general burst=10 nodelay;
            rewrite ^/admin/(.*) /$1 break;
            rewrite ^/admin$ / break;
            proxy_pass http://pihole_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Management dashboard
        location /dashboard {
            root /var/www/privacy-hub;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Go backend API
        location /api/ {
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://go_backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Docker API proxy (for management)
        location /docker/ {
            limit_req zone=general burst=10 nodelay;
            rewrite ^/docker/(.*) /$1 break;
            proxy_pass http://docker_proxy_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            return 200 "Privacy Hub OK\n";
        }
    }
}
