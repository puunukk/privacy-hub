# Privacy Hub Host NGINX Configuration Template
# This template supports environment variable substitution for container names
# Use with envsubst to generate the final nginx.conf

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

# DNS Stream proxying for Pi-hole
stream {
    # DNS upstream - uses environment variable for container name
    upstream pihole_dns {
        server ${PIHOLE_CONTAINER_NAME:-privacy_hub_pihole}:53;
    }

    # DNS over UDP
    server {
        listen 53 udp;
        proxy_pass pihole_dns;
        proxy_timeout 1s;
        proxy_responses 1;
    }

    # DNS over TCP
    server {
        listen 53;
        proxy_pass pihole_dns;
        proxy_timeout 3s;
    }
}

# HTTP/HTTPS proxying
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance settings optimized for Raspberry Pi
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    server_tokens off;

    # Security headers - applied globally
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstreams to internal Docker containers - parameterized
    upstream pihole_web {
        server ${PIHOLE_CONTAINER_NAME:-privacy_hub_pihole}:80;
    }

    upstream searxng_web {
        server ${SEARXNG_CONTAINER_NAME:-privacy_hub_searxng}:8080;
    }

    upstream go_backend_api {
        server ${BACKEND_CONTAINER_NAME:-privacy_hub_go_backend}:${BACKEND_PORT:-8080};
    }

    upstream docker_proxy_api {
        server ${DOCKER_PROXY_CONTAINER_NAME:-privacy_hub_docker_proxy}:2375;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2 default_server;
        server_name ${DOMAIN_NAME:-privacy-hub.local} ${SERVER_IP:-_};

        # SSL configuration - paths can be customized
        ssl_certificate ${SSL_CERT_PATH:-/etc/nginx/ssl/server.crt};
        ssl_certificate_key ${SSL_KEY_PATH:-/etc/nginx/ssl/server.key};

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;

        # ROOT = SearXNG (private search homepage)
        location / {
            limit_req zone=search burst=30 nodelay;
            
            proxy_pass http://searxng_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            
            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Pi-hole admin interface
        location /admin {
            limit_req zone=general burst=10 nodelay;
            
            # Rewrite paths for Pi-hole admin
            rewrite ^/admin/(.*) /$1 break;
            rewrite ^/admin$ / break;
            
            proxy_pass http://pihole_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Pi-hole specific headers
            proxy_set_header X-Forwarded-Host $host;
            proxy_redirect off;
        }

        # Privacy Hub Management Dashboard (React SPA)
        location ${FRONTEND_PATH:-/manage} {
            # Static files served from build output
            root ${FRONTEND_ROOT:-/var/www/privacy-hub};
            index index.html;
            
            # Handle React Router client-side routing
            try_files $uri $uri/ ${FRONTEND_PATH:-/manage}/index.html;
            
            # Security headers for frontend
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
            
            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary "Accept-Encoding";
                
                # Enable gzip for static assets
                gzip_static on;
            }
            
            # Cache HTML files for shorter period
            location ~* \.html$ {
                expires 1h;
                add_header Cache-Control "public, must-revalidate";
            }
        }

        # Go backend API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://go_backend_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # API specific settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Enable CORS for API endpoints
            add_header Access-Control-Allow-Origin "$scheme://$host" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "$scheme://$host";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Docker API proxy (for container management)
        location /docker/ {
            limit_req zone=general burst=10 nodelay;
            
            # Remove /docker prefix when forwarding
            rewrite ^/docker/(.*) /$1 break;
            
            proxy_pass http://docker_proxy_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Docker API specific settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # System health check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Privacy Hub Host NGINX OK\nTime: $time_iso8601\n";
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ \.(env|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Additional server block for direct IP access (optional)
    server {
        listen 443 ssl http2;
        server_name ${SERVER_IP};

        # Use same SSL config
        ssl_certificate ${SSL_CERT_PATH:-/etc/nginx/ssl/server.crt};
        ssl_certificate_key ${SSL_KEY_PATH:-/etc/nginx/ssl/server.key};
        ssl_protocols TLSv1.2 TLSv1.3;

        # Redirect to primary domain if configured
        return 301 https://${DOMAIN_NAME:-$host}$request_uri;
    }
}